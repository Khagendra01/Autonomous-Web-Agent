<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Web Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            background: white;
        }
        
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e5e5;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #202123;
        }
        
        .chat-header .subtitle {
            font-size: 14px;
            color: #6e6e80;
            margin-top: 4px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f7f7f8;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .message {
            display: flex;
            gap: 16px;
            max-width: 100%;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }
        
        .message.user .message-avatar {
            background: #19c37d;
            color: white;
        }
        
        .message.assistant .message-avatar {
            background: #ab68ff;
            color: white;
        }
        
        .message.system .message-avatar {
            background: #8e8ea0;
            color: white;
        }
        
        .message-content {
            flex: 1;
            max-width: calc(100% - 48px);
        }
        
        .message.user .message-content {
            display: flex;
            justify-content: flex-end;
        }
        
        .message-bubble {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            word-wrap: break-word;
            line-height: 1.6;
            color: #374151;
            font-size: 15px;
        }
        
        .message.user .message-bubble {
            background: #f0f0f0;
            border: 1px solid #e5e5e5;
        }
        
        .message.assistant .message-bubble {
            background: white;
        }
        
        .message.system .message-bubble {
            background: #f9fafb;
            border: 1px solid #e5e5e5;
            font-size: 14px;
            color: #6e6e80;
        }
        
        .message-status {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
            padding-left: 4px;
        }
        
        .browser-screenshot {
            margin-top: 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e5e5e5;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
        }
        
        .browser-screenshot img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .loading-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 8px 0;
        }
        
        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #9ca3af;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }
        
        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        .chat-input-container {
            padding: 16px 24px 24px;
            background: white;
            border-top: 1px solid #e5e5e5;
        }
        
        .chat-input-wrapper {
            position: relative;
            max-width: 100%;
        }
        
        .chat-input {
            width: 100%;
            min-height: 52px;
            max-height: 200px;
            padding: 12px 52px 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            background: white;
            color: #202123;
            line-height: 1.5;
            transition: border-color 0.2s;
        }
        
        .chat-input:focus {
            border-color: #10a37f;
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }
        
        .chat-input::placeholder {
            color: #9ca3af;
        }
        
        .send-button {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: #19c37d;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
        }
        
        .send-button:hover:not(:disabled) {
            background: #16a86b;
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .input-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: center;
        }
        
        .action-button {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            color: #374151;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .action-button:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
        
        .action-button.danger {
            border-color: #ef4444;
            color: #ef4444;
        }
        
        .action-button.danger:hover {
            background: #fef2f2;
        }
        
        .action-button.hidden {
            display: none;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
        }
        
        .status-badge.starting {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-badge.running {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .status-badge.completed {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-badge.failed,
        .status-badge.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .status-badge.cancelled {
            background: #fef3c7;
            color: #92400e;
        }
        
        .stats-container {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            font-size: 12px;
            color: #6e6e80;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .stat-value {
            font-weight: 600;
            color: #202123;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #9ca3af;
            text-align: center;
            padding: 48px 24px;
        }
        
        .empty-state h2 {
            font-size: 20px;
            font-weight: 600;
            color: #202123;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 14px;
            max-width: 400px;
        }
        
        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <h1>Autonomous Web Agent</h1>
                <div class="subtitle">Watch your browser agent complete tasks in real-time</div>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="empty-state" id="emptyState">
                <h2>Start a conversation</h2>
                <p>Enter a task instruction below to begin. The agent will execute it and show you the results in real-time.</p>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea 
                    id="instructionInput" 
                    class="chat-input"
                    placeholder="Enter your task instruction..."
                    rows="1"
                >go to youtube and play hey jude</textarea>
                <button class="send-button" id="submitBtn" type="button">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1.5 1.5L14.5 8L1.5 14.5M14.5 8H1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="input-actions">
                <button class="action-button hidden" id="stopBtn">Stop Task</button>
                <button class="action-button hidden" id="viewLogsBtn">View Logs</button>
                <button class="action-button hidden" id="viewJsonBtn">View JSON</button>
                <div class="stats-container">
                    <div class="stat-item">
                        Screenshots: <span class="stat-value" id="screenshotCount">0</span>
                    </div>
                    <div class="stat-item">
                        Tasks: <span class="stat-value" id="tasksCount">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentTaskId = null;
        let screenshotCount = 0;
        let tasksCount = 0;
        
        const chatMessages = document.getElementById('chatMessages');
        const emptyState = document.getElementById('emptyState');
        const instructionInput = document.getElementById('instructionInput');
        const submitBtn = document.getElementById('submitBtn');
        const stopBtn = document.getElementById('stopBtn');
        const viewLogsBtn = document.getElementById('viewLogsBtn');
        const viewJsonBtn = document.getElementById('viewJsonBtn');
        
        // Auto-resize textarea
        function resizeTextarea() {
            instructionInput.style.height = 'auto';
            instructionInput.style.height = Math.min(instructionInput.scrollHeight, 200) + 'px';
        }
        
        instructionInput.addEventListener('input', resizeTextarea);
        
        // Resize on page load if there's initial content
        setTimeout(() => {
            if (instructionInput.value.trim()) {
                resizeTextarea();
            }
        }, 100);
        
        // Handle Enter key (Shift+Enter for new line)
        instructionInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!submitBtn.disabled) {
                    submitTask();
                }
            }
        });
        
        function addMessage(role, content, screenshot = null, status = null) {
            if (emptyState) {
                emptyState.style.display = 'none';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (role === 'user') {
                avatar.textContent = 'U';
            } else if (role === 'assistant') {
                avatar.textContent = 'A';
            } else {
                avatar.textContent = 'S';
            }
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            if (status === 'loading') {
                bubble.innerHTML = '<div class="loading-indicator"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
            } else {
                bubble.textContent = content;
            }
            
            if (status && status !== 'loading') {
                const statusBadge = document.createElement('div');
                statusBadge.className = `status-badge ${status}`;
                statusBadge.textContent = status.toUpperCase();
                bubble.appendChild(statusBadge);
            }
            
            if (screenshot) {
                const screenshotDiv = document.createElement('div');
                screenshotDiv.className = 'browser-screenshot';
                const img = document.createElement('img');
                img.src = `data:image/png;base64,${screenshot}`;
                img.alt = 'Browser screenshot';
                screenshotDiv.appendChild(img);
                bubble.appendChild(screenshotDiv);
            }
            
            messageContent.appendChild(bubble);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv;
        }
        
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function submitTask() {
            const instruction = instructionInput.value.trim();
            if (!instruction) return;
            
            // Add user message
            addMessage('user', instruction);
            
            // Clear input
            instructionInput.value = '';
            instructionInput.style.height = 'auto';
            submitBtn.disabled = true;
            
            // Add loading message
            const loadingMsg = addMessage('assistant', 'Starting task...', null, 'loading');
            
            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ instruction })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentTaskId = data.task_id;
                    socket.emit('join_task', { task_id: currentTaskId });
                    
                    // Remove loading message
                    loadingMsg.remove();
                    
                    // Add system message
                    addMessage('system', `Task started (ID: ${currentTaskId.substring(0, 8)}...)`);
                    
                    // Show stop button
                    stopBtn.classList.remove('hidden');
                    viewLogsBtn.classList.add('hidden');
                    viewJsonBtn.classList.add('hidden');
                    
                    tasksCount++;
                    document.getElementById('tasksCount').textContent = tasksCount;
                } else {
                    loadingMsg.remove();
                    addMessage('system', `Error: ${data.error || 'Failed to start task'}`, null, 'error');
                }
            } catch (error) {
                loadingMsg.remove();
                addMessage('system', `Error: ${error.message}`, null, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        }
        
        submitBtn.addEventListener('click', submitTask);
        
        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            stopBtn.textContent = 'Stopping...';
            
            try {
                const response = await fetch('/api/tasks/current/stop', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addMessage('system', 'Task stopped by user', null, 'cancelled');
                    stopBtn.classList.add('hidden');
                } else {
                    addMessage('system', `Error: ${data.error || 'Failed to stop task'}`, null, 'error');
                    stopBtn.disabled = false;
                }
            } catch (error) {
                addMessage('system', `Error: ${error.message}`, null, 'error');
                stopBtn.disabled = false;
            } finally {
                stopBtn.textContent = 'Stop Task';
            }
        });
        
        // Socket event handlers
        socket.on('task_status', (data) => {
            if (data.task_id === currentTaskId) {
                const statusMessages = {
                    'starting': 'Task is starting...',
                    'running': 'Task is running...',
                    'completed': 'Task completed successfully!',
                    'failed': 'Task failed',
                    'error': 'Task encountered an error',
                    'cancelled': 'Task was cancelled'
                };
                
                addMessage('system', data.message || statusMessages[data.status] || `Status: ${data.status}`, null, data.status);
                
                if (['completed', 'failed', 'error', 'cancelled'].includes(data.status)) {
                    stopBtn.classList.add('hidden');
                    
                    if (data.has_logs) {
                        viewLogsBtn.classList.remove('hidden');
                    }
                    if (data.has_json) {
                        viewJsonBtn.classList.remove('hidden');
                    }
                }
            }
        });
        
        socket.on('browser_update', (data) => {
            if (data.task_id === currentTaskId) {
                screenshotCount++;
                document.getElementById('screenshotCount').textContent = screenshotCount;
                
                // Add or update screenshot in latest assistant message
                const messages = chatMessages.querySelectorAll('.message.assistant');
                if (messages.length > 0) {
                    const lastMsg = messages[messages.length - 1];
                    let screenshotDiv = lastMsg.querySelector('.browser-screenshot');
                    
                    if (!screenshotDiv) {
                        screenshotDiv = document.createElement('div');
                        screenshotDiv.className = 'browser-screenshot';
                        const bubble = lastMsg.querySelector('.message-bubble');
                        if (bubble) {
                            bubble.appendChild(screenshotDiv);
                        }
                    }
                    
                    const img = screenshotDiv.querySelector('img') || document.createElement('img');
                    img.src = `data:image/png;base64,${data.screenshot}`;
                    img.alt = 'Browser screenshot';
                    if (!screenshotDiv.querySelector('img')) {
                        screenshotDiv.appendChild(img);
                    }
                    
                    scrollToBottom();
                } else {
                    // Create new assistant message with screenshot
                    addMessage('assistant', 'Browser update:', data.screenshot);
                }
            }
        });
        
        viewLogsBtn.addEventListener('click', async () => {
            if (!currentTaskId) return;
            
            try {
                const response = await fetch(`/api/tasks/${currentTaskId}/logs`);
                const data = await response.json();
                
                if (response.ok) {
                    showModal('Task Logs', `<pre style="background: #1a1a1a; color: #0f0; padding: 15px; border-radius: 8px; overflow: auto; max-height: 70vh; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(data.logs)}</pre>`);
                } else {
                    addMessage('system', `Error: ${data.error || 'Failed to load logs'}`, null, 'error');
                }
            } catch (error) {
                addMessage('system', `Error: ${error.message}`, null, 'error');
            }
        });
        
        viewJsonBtn.addEventListener('click', async () => {
            if (!currentTaskId) return;
            
            try {
                const response = await fetch(`/api/tasks/${currentTaskId}/json`);
                const data = await response.json();
                
                if (response.ok) {
                    const jsonStr = JSON.stringify(data.data, null, 2);
                    showModal('Task JSON Manifest', `<pre style="background: #1a1a1a; color: #0ff; padding: 15px; border-radius: 8px; overflow: auto; max-height: 70vh; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(jsonStr)}</pre>`);
                } else {
                    addMessage('system', `Error: ${data.error || 'Failed to load JSON'}`, null, 'error');
                }
            } catch (error) {
                addMessage('system', `Error: ${error.message}`, null, 'error');
            }
        });
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showModal(title, content) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: flex; align-items: center; justify-content: center;';
            
            const modal = document.createElement('div');
            modal.style.cssText = 'background: white; border-radius: 12px; padding: 25px; max-width: 90%; max-height: 90%; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);';
            
            modal.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; color: #202123; font-size: 18px; font-weight: 600;">${title}</h2>
                    <button id="closeModal" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;">✕</button>
                </div>
                <div>${content}</div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            document.getElementById('closeModal').addEventListener('click', () => {
                document.body.removeChild(overlay);
            });
            
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    document.body.removeChild(overlay);
                }
            });
        }
        
        // Load existing tasks on page load
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();
                tasksCount = tasks.length;
                document.getElementById('tasksCount').textContent = tasksCount;
            } catch (error) {
                console.error('Failed to load tasks:', error);
            }
        }
        
        loadTasks();
        
    </script>
</body>
</html>
