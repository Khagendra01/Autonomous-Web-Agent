[project]
name = "autoui-agent"
version = "0.1.0"
description = "Local-first autonomous UI-state capture with Playwright + LangGraph"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.8.0",
  "requests>=2.32.0",
  "pillow>=10.4.0",
  "ImageHash>=4.3",
  "rapidfuzz>=3.9.6",
  "typer>=0.12.5",
  "rich>=13.8.0",
  "pyyaml>=6.0.2",
  "networkx>=3.3",
  "matplotlib>=3.9.2",
  "playwright>=1.48.0",
  "flask>=3.0.3",
  "python-dotenv>=1.0.0"
]

[tool.uv]
dev-dependencies = []

