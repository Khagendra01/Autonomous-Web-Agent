syntax = "proto3";

package driver;

service Driver {
  rpc Init(InitRequest) returns (InitResponse);
  rpc Observe(ObserveRequest) returns (ObserveResponse);
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);
  rpc ScreenshotRegion(ScreenshotRegionRequest) returns (ScreenshotResponse);
  rpc Act(ActRequest) returns (ActResponse);
  rpc SmartLocate(SmartLocateRequest) returns (SmartLocateResponse);
}

message InitRequest { string app = 1; string url = 2; string cookies_path = 3; }
message InitResponse { bool ok = 1; string error = 2; string start_url = 3; }

message ObserveRequest {}
message Interactable { 
  string role = 1; 
  string label = 2; 
  string selector = 3; 
  bool disabled = 4;
  string tag = 5;
  repeated string classes = 6;
  string id = 7;
  string href = 8;
  string type = 9;
  string placeholder = 10;
  int32 backend_node_id = 11;  // CDP backend_node_id for stable element reference
}
message FrameInfo { int32 index = 1; string name = 2; string url = 3; }
message Focused { string role = 1; string name = 2; string tag = 3; string editable = 4; string text = 5; }
message ObserveResponse {
  string url = 1;
  repeated Interactable interactables = 2;
  repeated string errors = 3;
  repeated FrameInfo frames = 4;
  Focused focused = 5;
}

message ScreenshotRequest { bool full_page = 1; }
message ScreenshotRegionRequest { string selector = 1; int32 margin = 2; }
message ScreenshotResponse { bytes image_png = 1; string error = 2; }

message ActRequest {
  string type = 1;
  repeated string selectors = 2;
  string selector = 3;
  int32 frame = 4;
  string text = 5;
  int32 delta = 6;
  string keys = 7;
  string state = 8;
  int32 timeout = 9;
  int32 x = 10;
  int32 y = 11;
  string kind = 12;
  string substring = 13;
  int32 backend_node_id = 14;  // CDP backend_node_id for direct element reference (optional)
}
message ActResponse { bool ok = 1; string error = 2; }

message SmartLocateRequest {
  string description = 1;  // Natural language description of what to find
  string failed_selector = 2;  // The selector that failed (optional)
  bool use_llm = 3;  // Whether to use LLM for intelligent matching
}
message SmartLocateResponse {
  bool ok = 1;
  string error = 2;
  string selector = 3;  // The working selector found
  string strategy = 4;  // Which strategy worked (for debugging)
}


